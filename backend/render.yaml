services:
  - type: web
    name: backend-iaesen-final
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    # ESTA ES LA PARTE MÁGICA QUE ARREGLA EL PROBLEMA:
    disk:
      name: audios_storage
      mountPath: /opt/render/project/src/audios
      sizeGB: 1